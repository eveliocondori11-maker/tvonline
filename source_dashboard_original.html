<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORPATELEREDES IPTV Manager</title>
<style>
:root{--bg:#06132f;--panel:#0b214d;--panel2:#0d2a60;--line:#174a91;--cyan:#08d8ff;--blue:#087bff;--green:#00d66b;--purple:#963cff;--orange:#ff9f0a;--muted:#a9bfdc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#102d69 0,#06132f 55%);color:#f4f8ff;font:14px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;color:white;background:linear-gradient(110deg,#078bff,#0753d8);font-weight:700}button:hover{filter:brightness(1.15)}button.secondary{background:#193968;border:1px solid #3264a5}button.danger{background:#b82045}button.green{background:linear-gradient(110deg,#00d66b,#009a56)}button.purple{background:linear-gradient(110deg,#a63cff,#6522d8)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#0a1e45;border:1px solid #1762b5;border-radius:20px;padding:30px;box-shadow:0 20px 70px #0009;text-align:center}.logo{font-size:22px;font-weight:800;letter-spacing:.4px}.logo span{display:block;color:var(--cyan);font-size:16px;margin-top:5px}.loginbox input{width:100%;margin:8px 0}.loginbox button{width:100%;margin-top:12px}
input,select{background:#071a3b;color:white;border:1px solid #24518b;border-radius:8px;padding:10px;min-width:0}input::placeholder{color:#7f9bbf}label{display:block;color:#bdd0eb;font-size:12px;margin:8px 0 5px}.hint{color:#9bb4d4;font-size:12px;line-height:1.5}.error{color:#ff8097;min-height:18px}
#app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;background:#061a40;border-right:1px solid #1464bb;padding:18px 12px;display:flex;flex-direction:column;z-index:3}.brand{padding:6px 10px 24px}.brandmark{display:flex;align-items:center;gap:10px}.tv{font-size:28px;border:2px solid var(--cyan);border-radius:9px;padding:5px;color:var(--cyan)}.brand small{display:block;color:var(--cyan);font-weight:bold;margin-left:49px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;color:#dceaff;font-weight:500}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#087dff,#0648ba);box-shadow:0 5px 20px #006cff55}.sidebarfoot{margin-top:auto;background:#102b5b;padding:13px;border-radius:12px;color:#c9dcf6}
.main{margin-left:235px;min-height:100vh}.topbar{height:70px;border-bottom:1px solid #173f79;display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:15px;background:#061536cc;position:sticky;top:0;z-index:2}.search{width:min(520px,60%)}.topright{display:flex;align-items:center;gap:15px;color:#d9e9ff}.content{padding:22px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pagehead h1{font-size:28px;margin:0}.sub{color:var(--muted);margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.stat{padding:18px;border-radius:14px;border:1px solid #2773cf;background:linear-gradient(130deg,#0877ed,#063b99);box-shadow:0 8px 24px #00102d88}.stat:nth-child(2){background:linear-gradient(130deg,#00bf69,#007c4d);border-color:#00e17b}.stat:nth-child(3){background:linear-gradient(130deg,#9238f4,#5014ae);border-color:#b56bff}.stat:nth-child(4){background:linear-gradient(130deg,#ffae1b,#a95100);border-color:#ffc24b}.stat strong{display:block;font-size:28px;margin:7px 0}.stat span{color:#e4efff}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.panel{background:linear-gradient(145deg,#0b2350,#081a3c);border:1px solid #1c579e;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 8px 25px #0003}.panel h3{margin:0 0 14px;font-size:17px}.barlist{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:90px 1fr 42px;gap:10px;align-items:center}.bar{height:9px;background:#122e5d;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00cfff,#087bff);border-radius:10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{padding:13px 8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #193a6b;white-space:nowrap}th{color:#9fc5f4;font-size:12px}td{color:#e5efff}.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:bold;background:#087d4b}.pill.off{background:#a71d3e}.pill.warn{background:#94600b}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:140px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0a2049;border:1px solid #2675c7;border-radius:16px;padding:20px;box-shadow:0 20px 70px #000b}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}.formgrid .full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.empty{text-align:center;padding:35px;color:#9eb5d5}.footer{border-top:1px solid #1a447d;padding:12px 22px;color:#80a9d9;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px}
@media(max-width:900px){.sidebar{width:68px;padding:12px 7px}.brand{padding:5px}.brandmark{justify-content:center}.brandtext,.sidebarfoot,.nav .txt{display:none}.nav button{text-align:center;font-size:20px;padding:12px 4px}.main{margin-left:68px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:14px}.topbar{padding:0 12px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.topright .adminlabel{display:none}}
</style>

<style>
/* Identidad visual CORPATELEREDES */
.sidebar .brand{padding:4px 2px 20px;text-align:center}
.sidebar .brandlogo{display:block;width:100%;max-width:205px;height:auto;margin:0 auto;border-radius:16px;border:1px solid #087bff;box-shadow:0 0 22px #087bff55}
.dashboard-brand{display:flex;align-items:center;gap:16px;padding:14px 18px;margin:0 0 18px;border:1px solid #168bff;border-radius:16px;background:linear-gradient(115deg,#09295c,#071a3d 58%,#102f68);box-shadow:0 8px 26px #007bff22}
.dashboard-brand img{width:86px;height:86px;object-fit:cover;border-radius:12px;border:1px solid #1a9cff}
.dashboard-brand b{display:block;font-size:23px;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#31d8ff,#ffd34e);-webkit-background-clip:text;background-clip:text;color:transparent}
.dashboard-brand span{display:block;color:#b9d9ff;margin-top:5px;font-size:13px;letter-spacing:.4px}
@media(max-width:900px){.sidebar .brandlogo{width:54px;height:54px;object-fit:cover}.dashboard-brand{padding:10px}.dashboard-brand img{width:62px;height:62px}.dashboard-brand b{font-size:18px}}
@media(max-width:520px){.dashboard-brand{gap:10px}.dashboard-brand img{width:54px;height:54px}.dashboard-brand b{font-size:15px}}
</style>

function clientTable(arr,ops=true){return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>MAC</th><th>Usuario</th><th>Plan</th><th>Vencimiento</th><th>Estado</th>${ops?'<th>Acciones</th>':''}</tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mac)}</td><td>${esc(x.username)}</td><td>${esc(x.plan)}</td><td>${esc(x.expiry)}</td><td>${status(x.status)}</td>${ops?`<td><button class="secondary" onclick="openClient(${x.id})">Editar</button> <button class="danger" onclick="delClient(${x.id})">Borrar</button></td>`:''}</tr>`).join('')||`<tr><td colspan="7" class="empty">No hay clientes para mostrar.</td></tr>`}</tbody></table></div>`}
function clientPage(q=''){let arr=users.filter(x=>[x.name,x.mac,x.username,x.plan,x.status].join(' ').toLowerCase().includes(q));$('#view').innerHTML=`<div class="pagehead"><div><h1>♟ Clientes</h1><div class="sub">Administración por dirección MAC y usuario/contraseña</div></div><button class="green" onclick="openClient()">＋ Nuevo cliente</button></div><div class="panel"><div class="toolbar"><input id="clientFilter" placeholder="Buscar nombre, MAC o usuario..." value="${esc(q)}"><button class="secondary" onclick="exportCSV('clients')">Exportar CSV</button></div><div id="clientRows">${clientTable(arr)}</div></div>`;$('#clientFilter').oninput=e=>{let a=users.filter(x=>[x.name,x.mac,x.username,x.plan,x.status].join(' ').toLowerCase().includes(e.target.value.toLowerCase()));$('#clientRows').innerHTML=clientTable(a)}}
function channelPage(q=''){let arr=channels.filter(x=>[x.name,x.category,x.status].join(' ').toLowerCase().includes(q));$('#view').innerHTML=`<div class="pagehead"><div><h1>▣ Canales IPTV</h1><div class="sub">Catálogo y direcciones de transmisión</div></div><button class="green" onclick="openChannel()">＋ Nuevo canal</button></div><div class="panel"><div class="toolbar"><input id="channelFilter" placeholder="Buscar canal o categoría..." value="${esc(q)}"><button class="secondary" onclick="exportCSV('channels')">Exportar CSV</button></div><div id="channelRows">${channelTable(arr)}</div></div>`;$('#channelFilter').oninput=e=>$('#channelRows').innerHTML=channelTable(channels.filter(x=>[x.name,x.category,x.status].join(' ').toLowerCase().includes(e.target.value.toLowerCase())))}
function channelTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Canal</th><th>Categoría</th><th>URL / enlace</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td title="${esc(x.url)}">${esc(x.url||'No configurado')}</td><td>${status(x.status)}</td><td><button class="secondary" onclick="openChannel(${x.id})">Editar</button> <button class="danger" onclick="delChannel(${x.id})">Borrar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay canales.</td></tr>'}</tbody></table></div>`}
function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openClient(id=null){editing=id;let x=users.find(a=>a.id===id)||{name:'',mac:'',username:'',password:'',plan:'10 Mbps',expiry:'',status:'Activo',phone:'',notes:''};showModal(id?'Editar cliente':'Registrar cliente',`<form id="clientForm"><div class="formgrid">
<div><label>Nombre del cliente *</label><input name="name" required value="${esc(x.name)}"></div><div><label>Dirección MAC *</label><input name="mac" required placeholder="00:1A:79:XX:XX:XX" value="${esc(x.mac)}"></div>
<div><label>Usuario IPTV *</label><input name="username" required value="${esc(x.username)}"></div><div><label>Contraseña IPTV *</label><input name="password" required value="${esc(x.password)}"></div>
<div><label>Plan</label><select name="plan">${['5 Mbps','8 Mbps','10 Mbps','12 Mbps','15 Mbps','20 Mbps','30 Mbps','Personalizado'].map(v=>`<option ${x.plan===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Fecha de vencimiento</label><input type="date" name="expiry" value="${esc(x.expiry)}"></div>
<div><label>Estado</label><select name="status">${['Activo','Suspendido','Pendiente'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Teléfono</label><input name="phone" value="${esc(x.phone)}"></div>
<div class="full"><label>Notas</label><input name="notes" value="${esc(x.notes)}"></div></div><p class="hint">La MAC y las credenciales se guardan como datos administrativos en este navegador.</p><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar cliente</button></div></form>`);$('#clientForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(users.some(a=>a.mac.toLowerCase()===d.mac.toLowerCase()&&a.id!==id)){alert('Ya existe un cliente con esa MAC.');return}if(users.some(a=>a.username.toLowerCase()===d.username.toLowerCase()&&a.id!==id)){alert('Ese usuario ya está registrado.');return}if(id)users=users.map(a=>a.id===id?{...a,...d}:a);else users.push({id:Date.now(),...d});persist();closeModal();render()}}
function delClient(id){if(confirm('¿Eliminar este cliente?')){users=users.filter(x=>x.id!==id);persist();render()}}
function openChannel(id=null){editing=id;let x=channels.find(a=>a.id===id)||{name:'',category:'Deportes',url:'',status:'Activo'};showModal(id?'Editar canal':'Agregar canal',`<form id="channelForm"><div class="formgrid"><div><label>Nombre del canal *</label><input name="name" required value="${esc(x.name)}"></div><div><label>Categoría</label><select name="category">${['Deportes','Noticias','Infantiles','Películas','Series','Documentales','Otros'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="full"><label>URL de transmisión (opcional)</label><input name="url" placeholder="https://servidor/stream..." value="${esc(x.url)}"></div><div><label>Estado</label><select name="status"><option ${x.status==='Activo'?'selected':''}>Activo</option><option ${x.status==='Suspendido'?'selected':''}>Suspendido</option></select></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar canal</button></div></form>`);$('#channelForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(id)channels=channels.map(a=>a.id===id?{...a,...d}:a);else channels.push({id:Date.now(),...d});persist();closeModal();render()}}
function delChannel(id){if(confirm('¿Eliminar este canal?')){channels=channels.filter(x=>x.id!==id);persist();render()}}
function paymentPage(){$('#view').innerHTML=`<div class="pagehead"><div><h1>▤ Pagos</h1><div class="sub">Registro de cobros de clientes</div></div><button class="green" onclick="openPayment()">＋ Registrar pago</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Importe (Bs.)</th><th>Concepto</th><th>Referencia</th></tr></thead><tbody>${payments.slice().reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.client)}</td><td>${Number(p.amount).toFixed(2)}</td><td>${esc(p.concept)}</td><td>${esc(p.ref||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Todavía no hay pagos registrados.</td></tr>'}</tbody></table></div></div>`}
function openPayment(){showModal('Registrar pago',`<form id="payForm"><label>Cliente</label><select name="client">${users.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select><label>Importe (Bs.) *</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Fecha</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"><label>Concepto</label><input name="concept" value="Mensualidad"><label>Referencia</label><input name="ref"><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar pago</button></div></form>`);$('#payForm').onsubmit=e=>{e.preventDefault();payments.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});persist();closeModal();render()}}
function settingsPage(){let a=read('crm_admin',{user:'admin',pass:'admin123'});$('#view').innerHTML=`<div class="pagehead"><div><h1>⚙ Configuración</h1><div class="sub">Cuenta de administrador y respaldo</div></div></div><div class="panel"><h3>Cambiar acceso al panel</h3><form id="settingsForm" style="max-width:500px"><label>Nuevo usuario administrador</label><input name="user" required value="${esc(a.user)}"><label>Nueva contraseña</label><input name="pass" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"><p class="hint">Por seguridad, cambia las credenciales de demostración al primer ingreso.</p><button>Guardar credenciales</button><div class="hint" id="settingsMsg"></div></form></div><div class="panel"><h3>Personalizar logo del panel</h3><p class="hint">Selecciona una imagen PNG o JPG. Se mostrará en el menú lateral y en el encabezado del dashboard.</p><img id="brandLogoPreview" style="max-width:150px;max-height:100px;object-fit:contain;border-radius:12px;background:#081b3a;padding:8px" alt="Vista previa del logo"><label>Subir logo manualmente</label><input id="brandLogoUpload" type="file" accept="image/png,image/jpeg,image/webp"><button class="secondary" id="resetBrandLogo" type="button">Restaurar logo predeterminado</button></div><div class="panel"><h3>Respaldo de datos</h3><p class="hint">Descarga una copia JSON de clientes, canales y pagos guardados en este navegador.</p><button onclick="backup()">Descargar respaldo JSON</button> <button class="secondary" onclick="document.getElementById('restoreFile').click()">Restaurar respaldo</button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div><div class="panel"><h3>Información importante</h3><p class="hint">Esta versión funciona localmente en el navegador y guarda los datos en este dispositivo. No sincroniza con un servidor IPTV ni aplica cortes reales por MAC. Para uso multiusuario y control real de dispositivos se requiere backend, base de datos y conexión autorizada con el servidor IPTV.</p></div>`;$('#settingsForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));save('crm_admin',d);$('#settingsMsg').textContent='Credenciales actualizadas. Vuelve a iniciar sesión en el próximo acceso.';$('#topUser').textContent=d.user;$('#sideUser').textContent=d.user};$('#restoreFile').onchange=restore;
let brandSaved=localStorage.getItem('crm_brand_logo');
const brandPreview=document.getElementById('brandLogoPreview');
if(brandPreview) brandPreview.src=brandSaved||document.querySelector('.brandlogo')?.src||'';
document.getElementById('brandLogoUpload').onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>1500000){alert('El logo debe pesar menos de 1.5 MB.');ev.target.value='';return;}const reader=new FileReader();reader.onload=()=>{localStorage.setItem('crm_brand_logo',reader.result);document.querySelectorAll('.brandlogo,.dashboard-brand img').forEach(img=>img.src=reader.result);if(brandPreview)brandPreview.src=reader.result;alert('Logo actualizado en este navegador.');};reader.readAsDataURL(f);};
document.getElementById('resetBrandLogo').onclick=()=>{localStorage.removeItem('crm_brand_logo');location.reload();};}
function exportCSV(type){let rows=type==='clients'?users:type==='channels'?channels:payments;if(!rows.length){alert('No hay datos para exportar.');return}let keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download(csv,type+'.csv','text/csv;charset=utf-8')}
function backup(){download(JSON.stringify({users,channels,payments,admin:read('crm_admin',{user:'admin',pass:'admin123'})},null,2),'corpateleredes-respaldo.json','application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.users)||!Array.isArray(d.channels)||!Array.isArray(d.payments))throw Error();users=d.users;channels=d.channels;payments=d.payments;if(d.admin)save('crm_admin',d.admin);persist();alert('Respaldo restaurado.');render()}catch{alert('El archivo no es un respaldo válido.')}};r.readAsText(f)}
function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
</script>

<style>
/* CORPATELEREDES IPTV Manager - ampliación v2 */
.pill.pending{background:#94600b}.pill.info{background:#155e9a}
.notice{padding:12px 14px;border:1px solid #94600b;background:#392b0b;border-radius:10px;color:#ffe0a0;margin:10px 0}
.qrbox{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px;align-items:center}
.qrimage{width:100%;max-width:240px;aspect-ratio:1;object-fit:contain;background:white;padding:8px;border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:#102b5b;border:1px solid #24518b;border-radius:10px;padding:12px}
.kpi b{display:block;font-size:20px;margin-top:5px}
@media(max-width:600px){.qrbox{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
<script>
/* Extensiones funcionales v2. Datos locales: requiere backend para operación multi-dispositivo. */
(()=>{
const $=s=>document.querySelector(s);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let audit=read('crm_audit',[]), cfg=read('crm_billing_cfg',{business:'CORPATELEREDES',bank:'',account:'',holder:'',qr:'',currency:'Bs',autoSuspend:true,graceDays:0});
const money=n=>'Bs. '+Number(n||0).toFixed(2);
function log(action,detail){audit.push({id:Date.now(),date:new Date().toLocaleString('es-BO'),action,detail});if(audit.length>1000)audit=audit.slice(-1000);save('crm_audit',audit)}
function byId(id){return users.find(u=>String(u.id)===String(id))}
function today(){return new Date().toISOString().slice(0,10)}
function dateAdd(date,months=1){let d=date?new Date(date+'T12:00:00'):new Date();d.setMonth(d.getMonth()+months);return d.toISOString().slice(0,10)}
function overdue(u){return !!u.expiry&&u.expiry<today()}
function updateDue(){let changed=false;if(cfg.autoSuspend){users.forEach(u=>{let limit=u.expiry?new Date(u.expiry+'T12:00:00'):null;if(limit)limit.setDate(limit.getDate()+Number(cfg.graceDays||0));let isLate=!!limit&&limit<new Date(today()+'T00:00:00');if(isLate&&u.status==='Activo'){u.status='Suspendido';u.suspendReason='Vencimiento de pago';u.suspendedAt=today();changed=true;log('Suspensión automática',u.name+' por vencimiento')}})}if(changed){save('crm_users',users)}}
function addNav(){let nav=$('.nav');if(!nav||nav.querySelector('[data-page="billing"]'))return;
[['billing','💳','Cobros QR'],['reports','📊','Reportes'],['audit','📋','Auditoría']].forEach(([p,ic,t])=>{let b=document.createElement('button');b.dataset.page=p;b.innerHTML=ic+' <span class="txt">'+t+'</span>';b.onclick=()=>setPage(p);nav.appendChild(b)})}
const oldSetPage=setPage;
setPage=function(p){page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};
const oldRender=render;
render=function(){updateDue();const q=$('#globalSearch')?.value.toLowerCase()||'';if(page==='billing'||page==='payments')billingPage();else if(page==='reports')reportsPage();else if(page==='audit')auditPage();else oldRender()};
const oldOpenClient=openClient;
openClient=function(id=null){
 editing=id;let x=users.find(a=>a.id===id)||{name:'',mac:'',username:'',password:'',plan:'10 Mbps',expiry:'',status:'Activo',phone:'',notes:'',address:'',monthlyFee:0,suspendReason:'',suspendedAt:''};
 showModal(id?'Editar cliente':'Registrar cliente',`<form id="clientForm"><div class="formgrid">
 <div><label>Nombre del cliente *</label><input name="name" required value="${esc(x.name)}"></div><div><label>Teléfono / WhatsApp</label><input name="phone" value="${esc(x.phone)}"></div>
 <div><label>Dirección MAC *</label><input name="mac" required placeholder="00:1A:79:XX:XX:XX" value="${esc(x.mac)}"></div><div><label>Dirección</label><input name="address" value="${esc(x.address)}"></div>
 <div><label>Usuario IPTV *</label><input name="username" required value="${esc(x.username)}"></div><div><label>Contraseña IPTV *</label><input name="password" required value="${esc(x.password)}"></div>
 <div><label>Plan</label><select name="plan">${['5 Mbps','8 Mbps','10 Mbps','12 Mbps','15 Mbps','20 Mbps','30 Mbps','Personalizado'].map(v=>`<option ${x.plan===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div><label>Mensualidad (Bs.)</label><input name="monthlyFee" type="number" min="0" step=".01" value="${esc(x.monthlyFee||0)}"></div>
 <div><label>Vencimiento</label><input type="date" name="expiry" value="${esc(x.expiry)}"></div><div><label>Estado</label><select name="status">${['Activo','Suspendido','Pendiente'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="full"><label>Motivo de suspensión / observaciones</label><input name="suspendReason" value="${esc(x.suspendReason||'')}"></div>
 <div class="full"><label>Notas internas</label><input name="notes" value="${esc(x.notes)}"></div></div>
 <p class="hint">El cambio de estado aquí es administrativo. La desconexión real requiere integrar este panel con tu servidor IPTV autorizado.</p>
 <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar cliente</button></div></form>`);
 $('#clientForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.monthlyFee=Number(d.monthlyFee||0);if(users.some(a=>a.mac.toLowerCase()===d.mac.toLowerCase()&&a.id!==id)){alert('Ya existe un cliente con esa MAC.');return}if(users.some(a=>a.username.toLowerCase()===d.username.toLowerCase()&&a.id!==id)){alert('Ese usuario ya está registrado.');return}
 let previous=users.find(a=>a.id===id);if(d.status==='Suspendido'&&(!previous||previous.status!=='Suspendido')){d.suspendedAt=today();d.suspendReason=d.suspendReason||'Suspensión manual'}if(d.status==='Activo'){d.suspendedAt='';d.suspendReason=''}
 if(id){users=users.map(a=>a.id===id?{...a,...d}:a);log('Cliente actualizado',d.name+' · '+d.status)}else{users.push({id:Date.now(),...d});log('Cliente creado',d.name)}persist();closeModal();render()}
};
window.suspendClient=function(id){let u=byId(id);if(!u)return;let reason=prompt('Motivo de suspensión:', 'Falta de pago');if(reason===null)return;u.status='Suspendido';u.suspendReason=reason;u.suspendedAt=today();persist();log('Suspensión manual',u.name+' · '+reason);render()};
window.activateClient=function(id){let u=byId(id);if(!u)return;if(!confirm('¿Confirmas la activación administrativa de '+u.name+'?'))return;u.status='Activo';u.suspendReason='';u.suspendedAt='';persist();log('Activación manual',u.name);render()};
const oldClientTable=clientTable;
clientTable=function(arr,ops=true){return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>MAC</th><th>Usuario</th><th>Plan</th><th>Mensualidad</th><th>Vencimiento</th><th>Estado</th>${ops?'<th>Acciones</th>':''}</tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mac)}</td><td>${esc(x.username)}</td><td>${esc(x.plan)}</td><td>${money(x.monthlyFee)}</td><td>${esc(x.expiry||'—')}</td><td>${status(x.status)}${x.suspendReason?'<br><small>'+esc(x.suspendReason)+'</small>':''}</td>${ops?`<td><button class="secondary" onclick="openClient(${x.id})">Editar</button> ${x.status==='Activo'?`<button class="danger" onclick="suspendClient(${x.id})">Suspender</button>`:`<button class="green" onclick="activateClient(${x.id})">Activar</button>`} <button class="purple" onclick="newClientCharge(${x.id})">Cobrar</button> <button class="danger" onclick="delClient(${x.id})">Borrar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="8" class="empty">No hay clientes para mostrar.</td></tr>'}</tbody></table></div>`};
window.newClientCharge=function(id){let u=byId(id);if(!u)return;openCharge(u.id)};
function billingPage(){let pending=payments.filter(p=>(p.paymentStatus||'Confirmado')==='Pendiente').length,paid=payments.filter(p=>(p.paymentStatus||'Confirmado')==='Confirmado').reduce((s,p)=>s+Number(p.amount||0),0);$('#view').innerHTML=`<div class="pagehead"><div><h1>💳 Cobros y pagos QR</h1><div class="sub">Control de mensualidades, comprobantes y activaciones</div></div><button class="green" onclick="openCharge()">＋ Nuevo cobro</button></div>
 <div class="kpis"><div class="kpi">Pagos pendientes<b>${pending}</b></div><div class="kpi">Cobrado confirmado<b>${money(paid)}</b></div><div class="kpi">Clientes vencidos<b>${users.filter(overdue).length}</b></div></div>
 <section class="panel"><h3>Configuración de cobro QR</h3><div class="qrbox"><div>${cfg.qr?`<img class="qrimage" src="${cfg.qr}" alt="QR de cobro">`:'<div class="qrimage" style="display:grid;place-items:center;color:#123">Sube tu QR aquí</div>'}<label>Imagen QR (PNG/JPG)</label><input id="qrUpload" type="file" accept="image/*"></div><div><form id="qrConfig"><label>Nombre comercial</label><input name="business" value="${esc(cfg.business)}"><label>Banco / billetera</label><input name="bank" value="${esc(cfg.bank)}"><label>Número de cuenta o celular</label><input name="account" value="${esc(cfg.account)}"><label>Titular</label><input name="holder" value="${esc(cfg.holder)}"><label><input style="width:auto" type="checkbox" name="autoSuspend" ${cfg.autoSuspend?'checked':''}> Suspender automáticamente al vencer</label><label>Días de gracia</label><input type="number" name="graceDays" min="0" max="30" value="${Number(cfg.graceDays||0)}"><button>Guardar configuración QR</button></form><p class="hint">Carga el QR estático de tu banco o billetera. La confirmación del pago es manual en esta versión.</p></div></div></section>
 <section class="panel"><h3>Historial de cobros</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Importe</th><th>Concepto</th><th>Estado</th><th>Referencia</th><th>Acciones</th></tr></thead><tbody>${payments.slice().reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.client)}</td><td>${money(p.amount)}</td><td>${esc(p.concept)}</td><td>${status(p.paymentStatus||'Confirmado')}</td><td>${esc(p.ref||'—')}</td><td>${(p.paymentStatus||'Confirmado')==='Pendiente'?`<button class="green" onclick="confirmPayment(${p.id})">Confirmar y activar</button> <button class="danger" onclick="rejectPayment(${p.id})">Rechazar</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Todavía no hay cobros.</td></tr>'}</tbody></table></div></section>`;
 $('#qrConfig').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));cfg={...cfg,...d,autoSuspend:e.target.autoSuspend.checked,graceDays:Number(d.graceDays||0)};save('crm_billing_cfg',cfg);alert('Configuración guardada.');render()};
 $('#qrUpload').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('La imagen debe pesar menos de 1.5 MB.');return}let r=new FileReader();r.onload=()=>{cfg.qr=r.result;save('crm_billing_cfg',cfg);render()};r.readAsDataURL(f)};
}
window.openCharge=function(clientId=null){let u=byId(clientId)||users[0];if(!u){alert('Primero registra un cliente.');return}showModal('Generar cobro',`<form id="chargeForm"><label>Cliente</label><select name="clientId">${users.map(x=>`<option value="${x.id}" ${x.id===u.id?'selected':''}>${esc(x.name)} · ${esc(x.username)}</option>`).join('')}</select><label>Importe (Bs.)</label><input name="amount" type="number" min=".01" step=".01" required value="${Number(u.monthlyFee||0)}"><label>Concepto</label><input name="concept" value="Mensualidad IPTV"><label>Fecha de cobro</label><input name="date" type="date" value="${today()}" required><label>Referencia / observación</label><input name="ref" placeholder="Opcional"><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Generar cobro pendiente</button></div></form>`);$('#chargeForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),c=byId(d.clientId);payments.push({id:Date.now(),clientId:c.id,client:c.name,amount:Number(d.amount),concept:d.concept,date:d.date,ref:d.ref,paymentStatus:'Pendiente'});persist();log('Cobro generado',c.name+' · '+money(d.amount));closeModal();render();showQrForLatest()}}
function showQrForLatest(){let p=payments[payments.length-1];showModal('Cobro generado · '+money(p.amount),`<div class="qrbox"><div>${cfg.qr?`<img class="qrimage" src="${cfg.qr}" alt="QR de pago">`:'<div class="qrimage" style="display:grid;place-items:center;color:#123">QR no configurado</div>'}</div><div><h3>${esc(cfg.business)}</h3><p>Importe: <b>${money(p.amount)}</b></p><p>Banco: ${esc(cfg.bank||'—')}</p><p>Cuenta/celular: ${esc(cfg.account||'—')}</p><p>Titular: ${esc(cfg.holder||'—')}</p><p class="hint">El cliente debe realizar el pago y enviar su comprobante. El servicio no se activa hasta que el administrador confirme el pago.</p></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button onclick="window.print()">Imprimir</button></div>`)}
window.confirmPayment=function(id){let p=payments.find(x=>x.id===id);if(!p||!confirm('¿Verificaste el abono en tu cuenta y confirmas este pago?'))return;p.paymentStatus='Confirmado';p.confirmedAt=today();let u=byId(p.clientId)||users.find(x=>x.name===p.client);if(u){u.status='Activo';u.expiry=dateAdd(u.expiry&&u.expiry>=today()?u.expiry:today(),1);u.suspendReason='';u.suspendedAt=''}persist();log('Pago confirmado y servicio activado',p.client+' · '+money(p.amount));render()};
window.rejectPayment=function(id){let p=payments.find(x=>x.id===id);if(!p)return;let reason=prompt('Motivo del rechazo:','Pago no recibido');if(reason===null)return;p.paymentStatus='Rechazado';p.rejectReason=reason;persist();log('Pago rechazado',p.client+' · '+reason);render()};
function reportsPage(){let total=payments.filter(p=>(p.paymentStatus||'Confirmado')==='Confirmado').reduce((s,p)=>s+Number(p.amount||0),0);$('#view').innerHTML=`<div class="pagehead"><div><h1>📊 Reportes</h1><div class="sub">Resumen de cartera y facturación</div></div><button onclick="exportCSV('clients')">Exportar clientes</button></div><div class="panel"><h3>Subclientes vinculados</h3><p class="hint">Clientes asociados a una cuenta principal para organizar tu cartera.</p><div class="stats"><div class="stat"><span>Subclientes</span><b>${users.filter(u=>u.parentClientId).length}</b></div><div class="stat"><span>Cuentas principales</span><b>${users.filter(u=>!u.parentClientId).length}</b></div></div></div><div class="stats"><div class="stat">Clientes<strong>${users.length}</strong></div><div class="stat">Activos<strong>${users.filter(u=>u.status==='Activo').length}</strong></div><div class="stat">Suspendidos<strong>${users.filter(u=>u.status==='Suspendido').length}</strong></div><div class="stat">Ingresos confirmados<strong>${money(total)}</strong></div></div><section class="panel"><h3>Clientes con vencimiento</h3>${clientTable(users.filter(u=>u.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry)),false)}</section><section class="panel"><h3>Exportar información</h3><button onclick="exportCSV('payments')">Exportar pagos CSV</button> <button onclick="exportCSV('clients')">Exportar clientes CSV</button> <button onclick="backup()">Respaldo completo JSON</button></section>`}
function auditPage(){$('#view').innerHTML=`<div class="pagehead"><div><h1>📋 Auditoría</h1><div class="sub">Registro de cambios, suspensiones y pagos</div></div><button class="secondary" onclick="download(JSON.stringify(audit,null,2),'auditoria-corpateleredes.json','application/json')">Descargar auditoría</button></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${audit.slice().reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sin movimientos todavía.</td></tr>'}</tbody></table></div></section>`}
const oldSettings=settingsPage;
settingsPage=function(){oldSettings();let box=document.createElement('section');box.className='panel';box.innerHTML='<h3>Facturación y suspensión</h3><p class="hint">Configura el QR y las reglas de vencimiento desde la sección Cobros QR. La suspensión automática se ejecuta al abrir o actualizar el panel.</p><button onclick="setPage(\'billing\')">Configurar cobros QR</button>';$('#view').appendChild(box)};
addNav();updateDue();
})();

<script>
/* Módulos v3: gestión manual de revendedores/subclientes y DNS de aplicación. */
(()=>{
 const $=s=>document.querySelector(s);

 let subclients=readV('crm_subclients',[]), dnsCfg=readV('crm_dns_cfg',{appName:'CORPATELEREDES IPTV',appDns:'',portalUrl:'',apiUrl:'',primaryDns:'',secondaryDns:'',serverIp:'',port:'',protocol:'https',notes:'',active:true});
 const escV=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 function subPage(){
  $('#view').innerHTML=`<div class="pagehead"><div><h1>👥 Administración de subclientes</h1><div class="sub">Crear y administrar cuentas de distribuidores manualmente</div></div><button class="green" onclick="openSubclient()">＋ Agregar subcliente</button></div>
  <div class="kpis"><div class="kpi">Subclientes registrados<b>${subclients.length}</b></div><div class="kpi">Activos<b>${subclients.filter(s=>s.status==='Activo').length}</b></div><div class="kpi">Clientes asignados<b>${users.filter(u=>u.parentClientId).length}</b></div></div>
  <section class="panel"><p class="hint">El administrador principal controla cada cuenta, sus límites, DNS y estado. Los cambios son administrativos locales; para acceso independiente y sincronización entre equipos se necesita backend.</p>
  <div class="tablewrap"><table><thead><tr><th>Subcliente</th><th>Usuario</th><th>Contacto</th><th>Clientes usados/límite</th><th>DNS asignado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${subclients.map(s=>`<tr><td>${escV(s.name)}</td><td>${escV(s.username)}</td><td>${escV(s.phone||'—')}</td><td>${countSubs(s)} / ${Number(s.maxClients||0)||'∞'}</td><td>${escV(s.dns||dnsCfg.appDns||'No asignado')}</td><td><span class="pill ${s.status==='Activo'?'':'off'}">${escV(s.status)}</span></td><td><button class="secondary" onclick="openSubclient(${s.id})">Editar</button> <button class="${s.status==='Activo'?'danger':'green'}" onclick="toggleSubclient(${s.id})">${s.status==='Activo'?'Suspender':'Activar'}</button> <button class="secondary" onclick="filterSubCustomers(${s.id})">Ver clientes</button> <button class="danger" onclick="deleteSubclient(${s.id})">Borrar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Todavía no hay subclientes registrados.</td></tr>'}</tbody></table></div></section>`;
 }
 window.openSubclient=function(id=null){
  let s=subclients.find(x=>x.id===id)||{name:'',username:'',password:'',phone:'',email:'',maxClients:20,dns:dnsCfg.appDns||'',status:'Activo',notes:''};
  showModal(id?'Editar subcliente':'Agregar subcliente',`<form id="subclientForm"><div class="formgrid">
  <div><label>Nombre / empresa *</label><input name="name" required value="${escV(s.name)}"></div><div><label>Teléfono</label><input name="phone" value="${escV(s.phone)}"></div>
  <div><label>Usuario de acceso *</label><input name="username" required value="${escV(s.username)}"></div><div><label>Contraseña *</label><input name="password" type="text" required value="${escV(s.password)}"></div>
  <div><label>Correo</label><input name="email" type="email" value="${escV(s.email)}"></div><div><label>Límite de clientes</label><input name="maxClients" type="number" min="1" value="${escV(s.maxClients)}"></div>
  <div class="full"><label>DNS asignado</label><input name="dns" placeholder="tv.tudominio.com" value="${escV(s.dns)}"></div>
  <div><label>Estado</label><select name="status"><option ${s.status==='Activo'?'selected':''}>Activo</option><option ${s.status==='Suspendido'?'selected':''}>Suspendido</option></select></div>
  <div class="full"><label>Notas administrativas</label><input name="notes" value="${escV(s.notes)}"></div></div><p class="hint">Esta cuenta se administra manualmente desde el panel. No crea por sí sola un usuario real de servidor.</p>
  <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar subcliente</button></div></form>`);
  $('#subclientForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.maxClients=Number(d.maxClients||1);if(subclients.some(x=>x.username.toLowerCase()===d.username.toLowerCase()&&x.id!==id)){alert('Ese usuario de subcliente ya existe.');return}
   if(id)subclients=subclients.map(x=>x.id===id?{...x,...d}:x);else subclients.push({id:Date.now(),...d,createdAt:new Date().toISOString()});
   saveV('crm_subclients',subclients);closeModal();render();
  };
 };
 window.toggleSubclient=function(id){let s=subclients.find(x=>x.id===id);if(!s)return;s.status=s.status==='Activo'?'Suspendido':'Activo';saveV('crm_subclients',subclients);render()};
 window.deleteSubclient=function(id){let s=subclients.find(x=>x.id===id);if(!s)return;if(users.some(u=>String(u.parentClientId)===String(id))){alert('Primero reasigna o elimina los clientes asociados a este subcliente.');return}if(confirm('¿Eliminar este subcliente?')){subclients=subclients.filter(x=>x.id!==id);saveV('crm_subclients',subclients);render()}};
 window.filterSubCustomers=function(id){let s=subclients.find(x=>x.id===id);if(!s)return;setPage('clients');setTimeout(()=>{let f=$('#clientFilter');if(f){f.value=s.name;f.dispatchEvent(new Event('input'))}},0)};
 function dnsPage(){
  $('#view').innerHTML=`<div class="pagehead"><div><h1>🌐 DNS de aplicación IPTV</h1><div class="sub">Configura el dominio, portal, API y DNS que utilizará tu aplicación</div></div></div>
  <section class="panel"><h3>Configuración DNS / aplicación</h3><form id="dnsForm"><div class="formgrid">
  <div><label>Nombre de la aplicación</label><input name="appName" value="${escV(dnsCfg.appName)}"></div><div><label>Dominio DNS principal</label><input name="appDns" placeholder="iptv.tudominio.com" value="${escV(dnsCfg.appDns)}"></div>
  <div class="full"><label>URL del portal IPTV</label><input name="portalUrl" placeholder="https://iptv.tudominio.com" value="${escV(dnsCfg.portalUrl)}"></div>
  <div class="full"><label>URL de API autorizada del servidor</label><input name="apiUrl" placeholder="https://servidor.tudominio.com/api" value="${escV(dnsCfg.apiUrl)}"></div>
  <div><label>DNS primario</label><input name="primaryDns" placeholder="1.1.1.1" value="${escV(dnsCfg.primaryDns)}"></div><div><label>DNS secundario</label><input name="secondaryDns" placeholder="8.8.8.8" value="${escV(dnsCfg.secondaryDns)}"></div>
  <div><label>IP pública del VPS</label><input name="serverIp" placeholder="IP de tu VPS" value="${escV(dnsCfg.serverIp)}"></div><div><label>Puerto de servicio</label><input name="port" placeholder="443" value="${escV(dnsCfg.port)}"></div>
  <div><label>Protocolo</label><select name="protocol"><option value="https" ${dnsCfg.protocol==='https'?'selected':''}>HTTPS</option><option value="http" ${dnsCfg.protocol==='http'?'selected':''}>HTTP</option></select></div>
  <div><label>Estado</label><select name="active"><option value="true" ${dnsCfg.active?'selected':''}>Activo</option><option value="false" ${!dnsCfg.active?'selected':''}>Inactivo</option></select></div>
  <div class="full"><label>Notas / instrucciones de configuración</label><input name="notes" value="${escV(dnsCfg.notes)}"></div></div>
  <div class="actions"><button type="button" class="secondary" onclick="copyDnsConfig()">Copiar configuración</button><button>Guardar DNS</button></div></form></section>
  <section class="panel"><h3>Registros DNS que debes crear en tu proveedor</h3><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Nombre / Host</th><th>Valor</th><th>Uso</th></tr></thead><tbody><tr><td>A</td><td>${escV(dnsCfg.appDns||'iptv')}</td><td>${escV(dnsCfg.serverIp||'IP pública del VPS')}</td><td>Apunta el dominio al VPS</td></tr><tr><td>CNAME</td><td>www</td><td>${escV(dnsCfg.appDns||'dominio principal')}</td><td>Alias web opcional</td></tr></tbody></table></div><p class="hint">Estos datos son una guía para configurar la zona DNS en Hostinger. Guardar aquí no cambia automáticamente los registros DNS, no emite certificados SSL ni configura Nginx.</p></section>`;
  $('#dnsForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.active=d.active==='true';dnsCfg=d;saveV('crm_dns_cfg',dnsCfg);alert('Configuración DNS guardada en este navegador.');render()};
 }
 window.copyDnsConfig=function(){let s=JSON.stringify(dnsCfg,null,2);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('Configuración copiada.')).catch(()=>alert(s));else alert(s)};
 // Add owner selector to customer form, preserving existing customer-save logic.
 const priorOpenClient=window.openClient;
 if(typeof priorOpenClient==='function')window.openClient=function(id=null){
  priorOpenClient(id);
  const form=$('#clientForm');if(!form)return;
  const current=users.find(u=>u.id===id)||{};
  const wrap=document.createElement('div');wrap.className='full';
  wrap.innerHTML=`<label>Asignar a subcliente / distribuidor</label><select name="parentClientId"><option value="">Administrador principal</option>${subclients.map(s=>`<option value="${s.id}" ${String(current.parentClientId||'')===String(s.id)?'selected':''}>${escV(s.name)} (${escV(s.username)})</option>`).join('')}</select>`;
  form.querySelector('.formgrid')?.appendChild(wrap);
  const oldSubmit=form.onsubmit;
  form.onsubmit=e=>{let chosen=new FormData(form).get('parentClientId');let sub=subclients.find(s=>String(s.id)===String(chosen));if(sub&&sub.status!=='Activo'){e.preventDefault();alert('Este subcliente está suspendido.');return}if(sub&&countSubs(sub)>=Number(sub.maxClients||0)&&String(current.parentClientId||'')!==String(sub.id)){e.preventDefault();alert('El subcliente alcanzó su límite de clientes.');return}if(oldSubmit)oldSubmit.call(form,e)};
 };
 const priorRender=window.render;
 window.render=function(){
  if(page==='subclients'){subPage();return}
  if(page==='dns'){dnsPage();return}
  priorRender();
  if(page==='dashboard'){
   const el=$('#view');if(el&&!el.querySelector('#subclientDash')){const section=document.createElement('section');section.className='panel';section.id='subclientDash';section.innerHTML=`<h3>👥 Red de subclientes</h3><div class="stats"><div class="stat"><span>Subclientes</span><strong>${subclients.length}</strong></div><div class="stat"><span>Activos</span><strong>${subclients.filter(s=>s.status==='Activo').length}</strong></div><div class="stat"><span>Clientes de subclientes</span><strong>${users.filter(u=>u.parentClientId).length}</strong></div><div class="stat"><span>DNS de aplicación</span><strong style="font-size:14px">${escV(dnsCfg.appDns||'Sin configurar')}</strong></div></div><button class="secondary" onclick="setPage('subclients')">Administrar subclientes</button> <button class="secondary" onclick="setPage('dns')">Configurar DNS</button>`;el.appendChild(section)}
  }
 };
 navV();
 // Update backup to include reseller and DNS settings.
 const oldBackup=window.backup;
 window.backup=function(){download(JSON.stringify({users,channels,payments,subclients,dnsCfg,admin:readV('crm_admin',{user:'admin',pass:'admin123'})},null,2),'corpateleredes-respaldo-completo.json','application/json')};
})();
</script>


<script>
(()=>{
 const $=s=>document.querySelector(s);
 let mikrotikRows=[];
 const escM=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function parseCSVLine(line,sep){let out=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===sep&&!q){out.push(v.trim());v=''}else v+=c}out.push(v.trim());return out}
 function parseMikrotik(text){
  let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()&&!x.trim().startsWith('#'));
  if(lines.some(x=>/^\s*\/(ip dhcp-server lease|ppp secret)/i.test(x))){
   let mode='';return lines.flatMap(line=>{
    if(/^\s*\/ip dhcp-server lease/i.test(line)){mode='dhcp';return []}
    if(/^\s*\/ppp secret/i.test(line)){mode='ppp';return []}
    if(!/^\s*add\s+/i.test(line)||!mode)return [];
    let kv={},re=/([\w-]+)=("(?:[^"\\]|\\.)*"|[^\s]+)/g,m;while((m=re.exec(line))){let val=m[2];if(val.startsWith('"'))val=val.slice(1,-1).replace(/\\"/g,'"').replace(/\\\\/g,'\\');kv[m[1]]=val}
    return [{name:kv.comment||kv.name||kv['mac-address']||kv.address||'Cliente MikroTik',mac:kv['mac-address']||'',username:kv.name||'',password:kv.password||'',ip:kv.address||'',plan:kv.profile||'MikroTik',status:kv.disabled==='yes'?'Suspendido':'Activo',phone:'',notes:`Importado de MikroTik (${mode})`}]
   })
  }
  let sep=lines[0]?.includes('\t')?'\t':(lines[0]?.includes(';')?';':',');
  let headers=parseCSVLine(lines.shift()||'',sep).map(x=>x.toLowerCase().replace(/[" _-]/g,''));
  const pick=(row,names)=>{let ix=headers.findIndex(h=>names.includes(h));return ix>=0?row[ix]||'':''};
  return lines.map(line=>{let r=parseCSVLine(line,sep);return {name:pick(r,['name','nombre','comment','comentario','customer','cliente'])||pick(r,['mac','macaddress'])||pick(r,['address','ipaddress'])||'Cliente importado',mac:pick(r,['mac','macaddress','macaddr']),username:pick(r,['username','user','usuario','name']),password:pick(r,['password','pass','contraseña']),ip:pick(r,['address','ip','ipaddress']),plan:pick(r,['profile','plan','perfil','rate'])||'MikroTik',status:/^(yes|true|1|disabled|suspendido)$/i.test(pick(r,['disabled','status','estado']))?'Suspendido':'Activo',phone:pick(r,['phone','telefono','teléfono']),notes:'Importado desde archivo MikroTik'}});
 }
 function mikrotikPage(){
  $('#view').innerHTML=`<div class="pagehead"><div><h1>📡 Importar clientes desde MikroTik</h1><div class="sub">Carga masiva desde exportaciones de RouterOS</div></div></div>
  <section class="panel"><h3>1. Seleccionar archivo</h3><p>En MikroTik puedes exportar las listas de <b>IP → DHCP Server → Leases</b> o <b>PPP → Secrets</b>. También puedes subir un CSV con columnas como name, mac-address, address, username, password, profile y disabled.</p>
  <label>Archivo .rsc, .txt o .csv</label><input id="mikrotikFile" type="file" accept=".rsc,.txt,.csv,text/plain,text/csv">
  <p class="hint">Para exportar desde RouterOS, puedes usar <code>/ip dhcp-server lease export</code> o <code>/ppp secret export</code>. Los archivos pueden contener contraseñas; súbelos solo desde un equipo seguro.</p>
  <div class="actions"><button class="secondary" id="mikrotikSample">Descargar CSV de ejemplo</button><button id="mikrotikParse">Analizar archivo</button></div></section>
  <section class="panel"><h3>2. Vista previa</h3><div id="mikrotikSummary" class="hint">Selecciona un archivo y pulsa Analizar archivo.</div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>MAC</th><th>Usuario</th><th>IP</th><th>Perfil</th><th>Estado</th></tr></thead><tbody id="mikrotikPreview"><tr><td colspan="6">Sin datos para mostrar.</td></tr></tbody></table></div><div class="actions"><button class="green" id="mikrotikImport" disabled>Importar clientes seleccionados</button></div></section>
  <section class="panel"><h3>Conexión directa por API (opcional)</h3><p>La conexión directa a cualquier MikroTik requiere habilitar RouterOS API/API-SSL y un backend seguro en tu VPS. No introduzcas aquí contraseñas del router: esta versión importa archivos exportados y no se conecta directamente al equipo.</p></section>`;
  $('#mikrotikFile').onchange=()=>{mikrotikRows=[];$('#mikrotikSummary').textContent='Archivo seleccionado. Pulsa Analizar archivo.';$('#mikrotikImport').disabled=true};
  $('#mikrotikParse').onclick=async()=>{let f=$('#mikrotikFile').files[0];if(!f){alert('Selecciona primero un archivo.');return}try{mikrotikRows=parseMikrotik(await f.text()).filter(x=>x.mac||x.username||x.ip);let fresh=mikrotikRows.filter(x=>!users.some(u=>(x.mac&&u.mac?.toLowerCase()===x.mac.toLowerCase())||(x.username&&u.username?.toLowerCase()===x.username.toLowerCase())));$('#mikrotikSummary').textContent=`Registros detectados: ${mikrotikRows.length}. Nuevos: ${fresh.length}. Duplicados aproximados: ${mikrotikRows.length-fresh.length}.`;$('#mikrotikPreview').innerHTML=fresh.slice(0,200).map(x=>`<tr><td>${escM(x.name)}</td><td>${escM(x.mac||'—')}</td><td>${escM(x.username||'—')}</td><td>${escM(x.ip||'—')}</td><td>${escM(x.plan)}</td><td>${escM(x.status)}</td></tr>`).join('')||'<tr><td colspan="6">No hay clientes nuevos para importar.</td></tr>';$('#mikrotikImport').disabled=!fresh.length;$('#mikrotikImport').dataset.count=String(fresh.length)}catch(e){alert('No se pudo analizar el archivo. Revisa que sea una exportación .rsc o un CSV válido.')}};
  $('#mikrotikImport').onclick=()=>{let fresh=mikrotikRows.filter(x=>!users.some(u=>(x.mac&&u.mac?.toLowerCase()===x.mac.toLowerCase())||(x.username&&u.username?.toLowerCase()===x.username.toLowerCase())));if(!fresh.length)return;if(!confirm(`¿Importar ${fresh.length} clientes nuevos?`))return;fresh.forEach((x,i)=>users.push({id:Date.now()+i,name:x.name,mac:x.mac,username:x.username,password:x.password||'',plan:x.plan||'MikroTik',expiry:'',status:x.status||'Activo',phone:x.phone||'',notes:x.notes+(x.ip?' | IP: '+x.ip:'')}));persist();alert(`Se importaron ${fresh.length} clientes.`);setPage('clients')};
  $('#mikrotikSample').onclick=()=>{let csv='name,mac-address,address,username,password,profile,disabled\nCliente Demo,AA:BB:CC:DD:EE:FF,192.168.88.10,cliente01,clave01,10 Mbps,no\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mikrotik_clientes_ejemplo.csv';a.click();URL.revokeObjectURL(a.href)};
 }
 const nav=$('.nav');if(nav&&!nav.querySelector('[data-page="mikrotik"]')){let b=document.createElement('button');b.dataset.page='mikrotik';b.innerHTML='📡 <span class="txt">Importar MikroTik</span>';b.onclick=()=>setPage('mikrotik');nav.appendChild(b)}
 const oldRender=window.render;
 window.render=function(){if(page==='mikrotik'){mikrotikPage();return}oldRender()};
})();
</script>
